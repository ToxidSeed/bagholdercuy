[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bagholdercuy"
version = "0.1.0"
description = "Bagholder Cuy Flask API"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Alone" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Framework :: Flask",
    "Operating System :: OS Independent",
]
dependencies = [
    "aniso8601>=9.0.1",
    "cachelib>=0.9.0",
    "certifi>=2022.9.24",
    "charset-normalizer>=2.1.1",
    "click>=8.0.1",
    "configparser>=5.3.0",
    "exceptiongroup>=1.2.2",
    "Flask>=2.0.1",
    "Flask-Cors>=3.0.10",
    "Flask-RESTful>=0.3.9",
    "Flask-Session>=0.4.0",
    "Flask-SQLAlchemy>=2.5.1",
    "greenlet>=1.1.2",
    "gunicorn>=21.2.0",
    "idna>=3.4",
    "iniconfig>=2.0.0",
    "itsdangerous>=2.0.1",
    "Jinja2>=3.0.1",
    "localStoragePy>=0.2.3",
    "markdown-it-py>=3.0.0",
    "MarkupSafe>=2.0.1",
    "mdurl>=0.1.2",
    "mysql-connector>=2.2.9",
    "numpy>=1.26.2",
    "packaging>=23.2",
    "pandas>=2.1.4",
    "pluggy>=1.5.0",
    "Pygments>=2.18.0",
    "PyJWT>=2.6.0",
    "python-dateutil>=2.8.2",
    "python-dotenv>=1.2.1",
    "pytz>=2021.3",
    "requests>=2.28.1",
    "rich>=13.8.0",
    "six>=1.16.0",
    "SQLAlchemy>=1.4.25",
    "tomli>=2.0.1",
    "typing_extensions>=4.12.2",
    "tzdata>=2023.3",
    "urllib3>=1.26.12",
    "Werkzeug>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-mock>=3.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*", "common*", "config*", "constants*", "controller*",
    "domain*", "helper*", "info*", "manager*", "model*",
    "parser*", "processor*", "proxy*", "reader*", "schemas*",
    "service*", "structure*", "utils*", "view*"
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py", "*_test.py"]
